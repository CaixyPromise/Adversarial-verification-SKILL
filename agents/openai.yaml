interface:
  display_name: "Adversarial Verification"
  short_description: "Requirement-first, risk-adaptive code review (0–3 verifier agents)."
  default_prompt: "Review the implementation against the original user requirements and business invariants. First assess complexity, impact, and uncertainty (0–6), then allocate zero to three independent verifier subagents with distinct scopes. Assign complementary roles: A validates requirements and business invariants, B compares existing and relevant historical implementations with pragmatic reuse, C evaluates performance, security, maintenance and distributed-system risks. With fewer agents combine roles without losing relevant coverage. Perform one coverage-first review with evidence-backed blockers, then targeted re-verification; do not chase PASS."
