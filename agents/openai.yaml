interface:
  display_name: "Adversarial Verification"
  short_description: "Requirement-first, risk-adaptive code review (0–3 verifier agents)."
  default_prompt: "Derive expected behavior independently from the original requirements and trusted contracts before judging the implementation. Attribute findings against the pre-change baseline when feasible (introduced/worsened/pre-existing/unknown). Review the implementation against the original user requirements and business invariants. First assess complexity, impact, and uncertainty (0–6), then allocate zero to three independent verifier subagents with distinct scopes. Assign complementary roles: A validates requirements and business invariants, B compares existing and relevant historical implementations with pragmatic reuse, C evaluates performance, security, maintenance and distributed-system risks. With fewer agents combine roles without losing relevant coverage. Before ordinary repairs, finish every assigned material scope with inspected paths/branches/tests and gaps; collect and consolidate all findings in one batch rather than finding one issue per round. Repair by root cause, then targeted re-verify; classify late issues on unchanged paths as missed original coverage, not a reason to restart an exhaustive review. State supported conclusions positively with decisive evidence and only decision-relevant uncertainties. Do not chase PASS."
